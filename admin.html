<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DARK ADMIN</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#050505;color:#fff}button,input,select{font:inherit}.top{height:68px;background:#0b0b0b;border-bottom:1px solid #242424;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:20}.brand{font-size:25px;font-weight:950}.brand span{color:#ff2d67}.wrap{max-width:1250px;margin:auto;padding:20px}.login{max-width:430px;margin:80px auto;background:#0d0d0d;border:1px solid #272727;border-radius:20px;padding:28px}.field{margin:11px 0}.field label{display:block;color:#aaa;font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;background:#151515;color:#fff;border:1px solid #333;border-radius:9px;padding:11px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.pink{background:#ff2d67;color:#fff}.white{background:#fff;color:#000}.ghost{background:#151515;color:#fff;border:1px solid #333}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{background:#0d0d0d;border:1px solid #272727;border-radius:16px;padding:18px}.stat small{color:#888}.stat b{display:block;font-size:26px;margin-top:7px}.panel{background:#0d0d0d;border:1px solid #272727;border-radius:16px;padding:18px;margin-top:15px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.toolbar input{flex:1;min-width:210px;background:#151515;color:#fff;border:1px solid #333;border-radius:9px;padding:11px}.order{border:1px solid #292929;background:#101010;border-radius:15px;padding:17px;margin:12px 0}.order.new{border-right:4px solid #ff2d67}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#242424;color:#ddd;font-size:12px}.pinktxt{color:#ff2d67}.muted{color:#8c8c8c}.finance{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}.product{padding:9px 0;border-bottom:1px solid #222}.product a{color:#ff8aa8;word-break:break-all}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:20px;background:#fff;color:#000;padding:12px 16px;border-radius:10px;display:none;z-index:50}@media(max-width:1100px){.finance{grid-template-columns:repeat(3,1fr)}}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid,.finance{grid-template-columns:1fr 1fr}.wrap{padding:13px}}
</style>
</head>
<body>
<header class="top"><div class="brand">DARK <span>ADMIN</span></div><button class="btn ghost" onclick="logout()">تسجيل خروج</button></header>
<div id="loginBox" class="login"><h1>دخول لوحة DARK</h1><p class="muted">هذه اللوحة خاصة بإدارة الطلبات والأرباح.</p><div class="field"><label>اسم المستخدم</label><input id="username" value="admin"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password"></div><button class="btn pink" style="width:100%" onclick="login()">دخول</button></div>
<main id="dashboard" class="wrap hidden">
<div class="grid"><div class="stat"><small>كل الطلبات</small><b id="allCount">0</b></div><div class="stat"><small>طلبات جديدة</small><b id="newCount">0</b></div><div class="stat"><small>قيمة الشراء</small><b id="purchaseTotal">$0</b></div><div class="stat"><small>ربح DARK</small><b id="profitTotal" class="pinktxt">$0</b></div><div class="stat"><small>صافي الربح</small><b id="netProfit" class="pinktxt">$0</b></div></div>
<div class="panel"><div class="row"><div><h2 style="margin:0">⚙️ التسعير</h2><small class="muted">هذه القيم داخلية ولا يظهر الربح للزبون.</small></div><button class="btn white" onclick="saveSettings()">حفظ</button></div><div class="finance"><div class="field"><label>ربح DARK لكل طلب ($)</label><input id="setProfit" type="number" step=".01"></div><div class="field"><label>شحن لكل قطعة ($)</label><input id="setShip" type="number" step=".01"></div><div class="field"><label>سعر الصرف</label><input id="setRate" type="number"></div></div></div>
<div class="panel"><div class="toolbar"><h2 style="margin:0">📦 الطلبات</h2><input id="search" placeholder="ابحث برقم الطلب، الاسم أو الهاتف..." oninput="renderOrders()"><select id="filter" onchange="renderOrders()"><option value="">كل الحالات</option></select><button class="btn ghost" onclick="load()">↻ تحديث</button></div><div id="orders"></div></div>
</main><div id="toast" class="toast"></div>
<script>
let token=localStorage.getItem("dark_admin_token")||"",orders=[],settings={profit:5,shipPerItem:4,rate:1310};
const statuses=['طلب جديد','قيد المراجعة','تم التسعير','بانتظار الدفع','تم الدفع','تم الشراء','قيد الشحن','وصل العراق','قيد التوصيل','تم التسليم','ملغى'];
async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok)return toast(d.error||'فشل الدخول');token=d.token;localStorage.setItem('dark_admin_token',token);await openDashboard()}
async function openDashboard(){const r=await fetch('/api/admin/orders',{headers:{Authorization:'Bearer '+token}});if(!r.ok){localStorage.removeItem('dark_admin_token');return}loginBox.classList.add('hidden');dashboard.classList.remove('hidden');await load()}
async function load(){const h={Authorization:'Bearer '+token};const r=await fetch('/api/admin/orders',{headers:h});if(!r.ok)return;orders=await r.json();settings=await (await fetch('/api/settings')).json();setProfit.value=settings.profit;setShip.value=settings.shipPerItem;setRate.value=settings.rate;filter.innerHTML='<option value="">كل الحالات</option>'+statuses.map(s=>`<option>${s}</option>`).join('');renderStats();renderOrders()}
async function saveSettings(){settings={profit:+setProfit.value||0,shipPerItem:+setShip.value||0,rate:+setRate.value||1310};const r=await fetch('/api/admin/settings',{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(settings)});toast(r.ok?'تم حفظ التسعير ✓':'تعذر الحفظ')}
async function updateOrder(id,data){const r=await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)return toast('تعذر تحديث الطلب');await load();toast('تم تحديث الطلب ✓')}
function renderStats(){allCount.textContent=orders.length;newCount.textContent=orders.filter(o=>o.status==='طلب جديد').length;purchaseTotal.textContent='$'+orders.reduce((s,o)=>s+(o.purchase_usd||0),0).toFixed(2);const gross=orders.reduce((s,o)=>s+(o.profit_usd||0),0),exp=orders.reduce((s,o)=>s+(o.expense_usd||0),0);profitTotal.textContent='$'+gross.toFixed(2);netProfit.textContent='$'+(gross-exp).toFixed(2)}
function renderOrders(){const q=(search.value||'').toLowerCase(),f=filter.value;const list=orders.filter(o=>(!f||o.status===f)&&(!q||[o.order_no,o.name,o.phone,o.governorate].join(' ').toLowerCase().includes(q)));ordersDiv.innerHTML=list.length?list.map(o=>{const count=o.items.reduce((s,x)=>s+x.qty,0);const purchase=o.purchase_usd||0,profit=o.profit_usd||0,expense=o.expense_usd||0;return `<article class="order ${o.status==='طلب جديد'?'new':''}"><div class="row"><div><b>${esc(o.order_no)}</b> <span class="tag">${esc(o.status)}</span></div><small class="muted">${new Date(o.created_at).toLocaleString('ar-IQ')}</small></div><div style="margin-top:10px"><b>${esc(o.name)}</b> — ${esc(o.phone)} — ${esc(o.governorate)}<br><span class="muted">${esc(o.address)}</span></div><div class="finance"><div><small class="muted">القطع</small><br><b>${count}</b></div><div><small class="muted">سعر الشراء</small><br><b>$${purchase.toFixed(2)}</b></div><div><small class="muted">ربح DARK</small><br><b class="pinktxt">$${profit.toFixed(2)}</b></div><div><small class="muted">مصاريف</small><br><b>$${expense.toFixed(2)}</b></div><div><small class="muted">صافي الربح</small><br><b class="pinktxt">$${(profit-expense).toFixed(2)}</b></div>
 <div><small class="muted">الشحن</small><br><b>$${Number(o.shipping_usd||0).toFixed(2)}</b></div>
 <div><small class="muted">المبلغ للزبون</small><br><b>$${Number(o.customer_total_usd||0).toFixed(2)}</b></div></div><div class="toolbar" style="margin-top:12px"><select onchange="updateOrder(${o.id},{status:this.value})">${statuses.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><input type="number" step=".01" value="${purchase}" placeholder="سعر الشراء $" onchange="updateOrder(${o.id},{purchase_usd:+this.value})"><input type="number" step=".01" value="${profit}" placeholder="الربح $" onchange="updateOrder(${o.id},{profit_usd:+this.value})"><input type="number" step=".01" value="${expense}" placeholder="مصاريف إضافية $" onchange="updateOrder(${o.id},{expense_usd:+this.value})"></div><details style="margin-top:12px"><summary>🔗 المنتجات (${o.items.length})</summary>${o.items.map((x,i)=>`<div class="product"><b>${i+1}.</b> <a href="${escAttr(x.url)}" target="_blank" rel="noopener">فتح المنتج</a><br><span class="muted">المقاس: ${esc(x.size)||'-'} | اللون: ${esc(x.color)||'-'} | الكمية: ${x.qty} | السعر: $${Number(x.price||0).toFixed(2)}</span></div>`).join('')}</details>${o.notes?`<div style="margin-top:10px"><span class="muted">ملاحظات:</span> ${esc(o.notes)}</div>`:''}</article>`}).join(''):'<div class="panel">ماكو طلبات مطابقة.</div>'}
function logout(){localStorage.removeItem('dark_admin_token');location.reload()}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]||m))}function escAttr(s){return esc(s)}if(token)openDashboard();
</script>
</body></html>
